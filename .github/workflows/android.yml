name: Android application
on:
  push:
    branches: [main, codex/news-application, codex/news-images, codex/widget-photos, codex/widget-navigation, codex/intelligent-alerts-ui, codex/editorial-reading-ui, codex/news-quality-252]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prepare and verify shared application assets
        run: |
          npm ci
          npm run build
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Restore application signing identity
        env:
          KEYSTORE: ${{ secrets.TDN_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/tdn-release.p12"
          chmod 600 "$RUNNER_TEMP/tdn-release.p12"
      - name: Build and check APK
        working-directory: android
        env:
          TDN_KEYSTORE_PATH: ${{ runner.temp }}/tdn-release.p12
          TDN_STORE_PASSWORD: ${{ secrets.TDN_STORE_PASSWORD }}
          TDN_KEY_ALIAS: tdn-release
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' >/dev/null
          gradle --no-daemon :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:lintRelease
          mkdir -p ../artifacts
          cp app/build/outputs/apk/release/app-release.apk ../artifacts/Thai-Daily-News-2.5.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../artifacts/app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ../artifacts/app-debug-androidTest.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs ../artifacts/Thai-Daily-News-2.5.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-application
          path: artifacts/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-reports
          path: android/app/build/reports/
  device-check:
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: android-application
          path: artifacts
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the app on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -dns-server 8.8.8.8
          disable-animations: true
          script: |
            adb install artifacts/app-debug.apk
            adb install artifacts/app-debug-androidTest.apk
            if [ ${{ matrix.api }} -ge 33 ]; then adb shell pm grant com.basssg.thaidailynews android.permission.POST_NOTIFICATIONS; fi
            adb shell am instrument -w com.basssg.thaidailynews.test/com.basssg.thaidailynews.SmokeInstrumentation | tee smoke-results.txt
            mkdir -p device-qa
            adb exec-out run-as com.basssg.thaidailynews tar -C files -cf - qa > device-qa.tar
            tar -xf device-qa.tar -C device-qa/ --strip-components=1
            adb logcat -d -v threadtime > device-qa/android-logcat.txt
            grep -q TDN_SMOKE_OK smoke-results.txt
            adb shell am start -n com.basssg.thaidailynews/.MainActivity
            adb shell am broadcast -n com.basssg.thaidailynews/.NotificationTestReceiver
            sleep 2
            adb shell cmd statusbar expand-notifications
            sleep 1
            adb shell screencap -p /sdcard/notifications-live.png
            adb pull /sdcard/notifications-live.png device-qa/notifications-live.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-check-api-${{ matrix.api }}
          path: |
            device-qa/
            smoke-results.txt
